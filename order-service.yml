server:
  port: 8084

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/order_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    consumer:
      group-id: ${order.kafka.consumer-group:order-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

security:
  internal-service-keys:
    payment-service: "${INTERNAL_KEY_PAYMENT:a1fb2971af06749e5ef5f695720338b5611f6fa8d51bbbb476db7ab2eec22319}"
    notification-service: "${INTERNAL_KEY_NOTIFICATION:9872c97a97c4a59def15e508794d867b8c7a24bbc170588ec154c65c878953ff}"

services:
  catalog-service:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    internal-key: "${INTERNAL_KEY_ORDER:e0de2d8d12cf23ec3ba59b392e0b52ee776e02cb8bc8dcdf30832fe86524c6e0}"
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
    internal-key: "${INTERNAL_KEY_ORDER:e0de2d8d12cf23ec3ba59b392e0b52ee776e02cb8bc8dcdf30832fe86524c6e0}"
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  identity-service:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    internal-key: "${INTERNAL_KEY_ORDER:e0de2d8d12cf23ec3ba59b392e0b52ee776e02cb8bc8dcdf30832fe86524c6e0}"
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

order:
  idempotency:
    retention-hours: 24
  kafka:
    consumer-group: order-service-group
    topic:
      payment-succeeded: payment.succeeded
      payment-failed: payment.failed
      reservation-expired: inventory.reservation-expired
      reservation-commit-failed: inventory.reservation-commit-failed
      order-created: order.created
      order-status-changed: order.status-changed
      order-cancelled: order.cancelled
    dlt:
      payment-succeeded: order.payment-succeeded.dlt
      payment-failed: order.payment-failed.dlt
      reservation-expired: order.reservation-expired.dlt
      reservation-commit-failed: order.reservation-commit-failed.dlt
    consumer:
      max-attempts: ${ORDER_KAFKA_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${ORDER_KAFKA_INITIAL_BACKOFF_MS:1000}
      max-backoff-ms: ${ORDER_KAFKA_MAX_BACKOFF_MS:4000}
      jitter-ms: 200
      dlt-suffix: .dlt

outbox:
  publisher:
    interval-ms: ${OUTBOX_PUBLISHER_INTERVAL_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
