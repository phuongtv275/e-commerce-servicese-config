server:
  port: 8084

spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://postgres:5432/order_db}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

security:
  gateway-assertion:
    public-key: "${GATEWAY_ASSERTION_PUBLIC_KEY:}"
  internal-service-keys:
    payment-service: "${INTERNAL_KEY_PAYMENT:}"

services:
  catalog-service:
    base-url: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
    internal-key: "${INTERNAL_KEY_ORDER:}"
    connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:5000}
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:http://inventory-service:8083}
    internal-key: "${INTERNAL_KEY_ORDER:}"
    connect-timeout-ms: ${INVENTORY_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${INVENTORY_READ_TIMEOUT_MS:5000}
  identity-service:
    base-url: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
    internal-key: "${INTERNAL_KEY_ORDER:}"
    connect-timeout-ms: ${IDENTITY_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${IDENTITY_READ_TIMEOUT_MS:5000}

order:
  idempotency:
    retention-hours: ${ORDER_IDEMPOTENCY_RETENTION_HOURS:24}
  kafka:
    consumer-group: order-service-group
    topic:
      payment-succeeded: payment.succeeded
      payment-failed: payment.failed
      reservation-expired: inventory.reservation-expired
      order-created: order.created
      order-status-changed: order.status-changed
      order-cancelled: order.cancelled
    consumer:
      max-attempts: ${ORDER_KAFKA_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${ORDER_KAFKA_INITIAL_BACKOFF_MS:100}
      max-backoff-ms: ${ORDER_KAFKA_MAX_BACKOFF_MS:400}
      dlt-suffix: .dlt

outbox:
  publisher:
    interval-ms: ${OUTBOX_PUBLISHER_INTERVAL_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
