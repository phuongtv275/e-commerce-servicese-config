server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/identity_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: "${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}"
    access-token-expiration: 900000 # 15 mins
    refresh-token-expiration: 604800000 # 7 days

security:
  internal-service-keys:
    order-service: "${INTERNAL_KEY_ORDER:e0de2d8d12cf23ec3ba59b392e0b52ee776e02cb8bc8dcdf30832fe86524c6e0}"
    notification-service: "${INTERNAL_KEY_NOTIFICATION:9872c97a97c4a59def15e508794d867b8c7a24bbc170588ec154c65c878953ff}"
