server:
  port: 8083

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/inventory_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  kafka:
    consumer:
      group-id: inventory-reservation-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

security:
  internal-service-keys:
    order-service: "${INTERNAL_KEY_ORDER:e0de2d8d12cf23ec3ba59b392e0b52ee776e02cb8bc8dcdf30832fe86524c6e0}"
    payment-service: "${INTERNAL_KEY_PAYMENT:a1fb2971af06749e5ef5f695720338b5611f6fa8d51bbbb476db7ab2eec22319}"
    notification-service: "${INTERNAL_KEY_NOTIFICATION:9872c97a97c4a59def15e508794d867b8c7a24bbc170588ec154c65c878953ff}"

inventory:
  reservation:
    ttl: ${INVENTORY_RESERVATION_TTL:15m}
    expiry-interval-ms: ${INVENTORY_EXPIRY_INTERVAL_MS:30000}
    expiry-initial-delay-ms: ${INVENTORY_EXPIRY_INITIAL_DELAY_MS:10000}
    expiry-batch-size: ${INVENTORY_EXPIRY_BATCH_SIZE:100}
  scheduler:
    expiry-interval: ${INVENTORY_EXPIRY_INTERVAL_MS:30000}
    expiry-initial-delay: ${INVENTORY_EXPIRY_INITIAL_DELAY_MS:10000}
    expiry-batch-size: ${INVENTORY_EXPIRY_BATCH_SIZE:100}
  kafka:
    consumer-group: inventory-reservation-group
    topic:
      payment-succeeded: payment.succeeded
      payment-failed: payment.failed
      order-cancelled: order.cancelled
      reservation-expired: inventory.reservation-expired
      reservation-commit-failed: inventory.reservation-commit-failed
    dlt:
      payment-succeeded: inventory.payment-succeeded.dlt
      payment-failed: inventory.payment-failed.dlt
      order-cancelled: inventory.order-cancelled.dlt
    consumer:
      max-attempts: ${INVENTORY_KAFKA_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${INVENTORY_KAFKA_INITIAL_BACKOFF_MS:1000}
      max-backoff-ms: ${INVENTORY_KAFKA_MAX_BACKOFF_MS:4000}
      dlt-suffix: .dlt

outbox:
  publisher:
    interval-ms: ${OUTBOX_PUBLISHER_INTERVAL_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
