server:
  port: 8086

spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/notification_db}
    username: ${DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
