server:
  port: 8086

spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/notification_db}
    username: ${DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    # SMTP endpoint is externally configurable; no provider-specific or mock defaults embedded
    host: ${MAIL_HOST:}
    # Standard SMTP submission port (RFC 6409); externally configurable
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtp}
    default-encoding: ${MAIL_DEFAULT_ENCODING:UTF-8}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: ${NOTIFICATION_KAFKA_CONSUMER_GROUP:notification-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

security:
  gateway-assertion:
    public-key: "${GATEWAY_ASSERTION_PUBLIC_KEY:}"

services:
  identity-service:
    base-url: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
    internal-key: "${INTERNAL_SERVICE_KEYS_NOTIFICATION_SERVICE:${INTERNAL_KEY_NOTIFICATION:}}"
    connect-timeout-ms: ${IDENTITY_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${IDENTITY_READ_TIMEOUT_MS:5000}
  order-service:
    base-url: ${ORDER_SERVICE_URL:http://order-service:8084}
    internal-key: "${INTERNAL_SERVICE_KEYS_NOTIFICATION_SERVICE:${INTERNAL_KEY_NOTIFICATION:}}"
    connect-timeout-ms: ${ORDER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${ORDER_READ_TIMEOUT_MS:5000}

notification:
  mail:
    from: ${MAIL_FROM:}
    connection-timeout-ms: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
    read-timeout-ms: ${MAIL_SMTP_READ_TIMEOUT_MS:5000}
    write-timeout-ms: ${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}
  kafka:
    consumer-group: ${NOTIFICATION_KAFKA_CONSUMER_GROUP:notification-service-group}
    topics:
      user-registered: ${KAFKA_TOPIC_USER_REGISTERED:user.registered}
      order-status-changed: ${KAFKA_TOPIC_ORDER_STATUS_CHANGED:order.status-changed}
      order-cancelled: ${KAFKA_TOPIC_ORDER_CANCELLED:order.cancelled}
      payment-succeeded: ${KAFKA_TOPIC_PAYMENT_SUCCEEDED:payment.succeeded}
      payment-refund-completed: ${KAFKA_TOPIC_PAYMENT_REFUND_COMPLETED:payment.refund-completed}
    consumer:
      max-attempts: ${NOTIFICATION_KAFKA_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${NOTIFICATION_KAFKA_INITIAL_BACKOFF_MS:1000}
      max-backoff-ms: ${NOTIFICATION_KAFKA_MAX_BACKOFF_MS:4000}
      dlt-suffix: ${NOTIFICATION_KAFKA_DLT_SUFFIX:.dlt}
  worker:
    concurrency: ${NOTIFICATION_WORKER_CONCURRENCY:5}
    claim-lease-minutes: ${NOTIFICATION_CLAIM_LEASE_MINUTES:10}
    initial-backoff-ms: ${NOTIFICATION_RETRY_INITIAL_BACKOFF_MS:1000}
    max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
  redrive:
    cron: "${NOTIFICATION_REDRIVE_CRON:0 */15 * * * *}"
    cooldown-minutes: ${NOTIFICATION_REDRIVE_COOLDOWN_MINUTES:5}
    batch-size: ${NOTIFICATION_REDRIVE_BATCH_SIZE:50}
    max-total-attempts: ${NOTIFICATION_REDRIVE_MAX_TOTAL_ATTEMPTS:10}
  retention:
    days: ${NOTIFICATION_RETENTION_DAYS:30}
    purge-cron: "${NOTIFICATION_RETENTION_PURGE_CRON:0 0 3 * * *}"
    zone: "${NOTIFICATION_RETENTION_ZONE:UTC}"
  verification:
    base-url: "${USER_VERIFICATION_BASE_URL:http://localhost:3000/verify-email}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
