server:
  port: 8085

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/payment_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    consumer:
      group-id: ${payment.kafka.consumer-group:payment-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

security:
  internal-service-keys:
    order-service: "${INTERNAL_KEY_ORDER:e0de2d8d12cf23ec3ba59b392e0b52ee776e02cb8bc8dcdf30832fe86524c6e0}"
    notification-service: "${INTERNAL_KEY_NOTIFICATION:9872c97a97c4a59def15e508794d867b8c7a24bbc170588ec154c65c878953ff}"

payment:
  kafka:
    consumer-group: payment-service-group
    topic:
      payment-late-success: payment.late-success
      order-cancelled: order.cancelled
      reservation-commit-failed: inventory.reservation-commit-failed
      reservation-expired: inventory.reservation-expired
      payment-succeeded: payment.succeeded
      payment-failed: payment.failed
      payment-refund-completed: payment.refund-completed
    dlt:
      payment-late-success: payment.payment-late-success.dlt
      order-cancelled: payment.order-cancelled.dlt
      reservation-commit-failed: payment.reservation-commit-failed.dlt
      reservation-expired: payment.reservation-expired.dlt
    consumer:
      max-attempts: ${PAYMENT_KAFKA_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${PAYMENT_KAFKA_INITIAL_BACKOFF_MS:1000}
      max-backoff-ms: ${PAYMENT_KAFKA_MAX_BACKOFF_MS:4000}
      jitter-ms: 200
      dlt-suffix: .dlt

services:
  order-service:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8084}
    internal-key: "${INTERNAL_KEY_PAYMENT:a1fb2971af06749e5ef5f695720338b5611f6fa8d51bbbb476db7ab2eec22319}"

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: "${VNPAY_HASH_SECRET}"
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  return-url: ${VNPAY_RETURN_URL}
  ipn-url: ${VNPAY_IPN_URL}
  version: ${VNPAY_VERSION:2.1.0}
  order-type: ${VNPAY_ORDER_TYPE:other}
  locale: ${VNPAY_LOCALE:vn}
  expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
  ip-address: ${VNPAY_IP_ADDRESS}
